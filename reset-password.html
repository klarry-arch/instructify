<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="assets/images/instructify-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/brand-tokens.css?v=2026.12">
  <link rel="stylesheet" href="css/global.css?v=2026.12">
  <link rel="stylesheet" href="css/components.css?v=2026.12">
  <link rel="stylesheet" href="css/dashboard.css?v=2026.12">
  <link rel="stylesheet" href="css/live-chat.css?v=2026.12">
  <link rel="stylesheet" href="css/site-header.css?v=2026.12">
  <style>
    body {
      background: radial-gradient(120% 120% at 50% 10%, #FFFDF7 0%, #F2F6FF 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px 56px;
    }
    .auth-card {
      background: #FFFFFF;
      border: 1px solid #E8E3D5;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(30, 27, 75, 0.08);
      max-width: 460px;
      width: 100%;
      padding: 32px 28px;
    }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-title { font-family: var(--font-heading); font-size: 24px; font-weight: 700; line-height: 1.25; color: #1E1B4B; margin-bottom: 6px; }
    .auth-subtitle { font-size: 14.5px; color: #5B5882; line-height: 1.5; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to password reset</a>

  <header class="sticky-header" role="banner">
    <div class="home-container">
      <div class="header-nav-wrap">
        <a href="index.html" class="brand-link" aria-label="Instructify Kenya Homepage">
          <img src="assets/images/instructify-kenya-logo.png" alt="Instructify Kenya Logo" class="brand-logo-img" width="160" height="38">
        </a>
        <nav class="desktop-nav" aria-label="Primary Navigation">
          <ul class="header-nav-links">
            <li class="header-nav-item"><a href="index.html" class="header-nav-link">Home</a></li>
            <li class="header-nav-item"><a href="courses.html" class="header-nav-link">Courses</a></li>
            <li class="header-nav-item"><a href="about.html" class="header-nav-link">About Us</a></li>
            <li class="header-nav-item"><a href="contact.html" class="header-nav-link">Contact</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a href="login.html" id="nav-login-btn" class="nav-login-btn">Log In</a>
          <a href="register.html" class="btn-primary-orange"><span>Create Account</span></a>
          <button type="button" class="mobile-nav-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-nav-drawer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="mobile-nav-drawer" class="mobile-drawer" role="dialog" aria-modal="true" aria-label="Mobile Navigation">
    <div class="mobile-drawer-top">
      <a href="index.html" class="brand-link"><img src="assets/images/instructify-kenya-logo.png" alt="Instructify Kenya Logo" class="brand-logo-img" width="144" height="34"></a>
      <button type="button" class="mobile-drawer-close" aria-label="Close navigation menu">&times;</button>
    </div>
    <nav class="mobile-drawer-links" aria-label="Mobile Drawer Navigation">
      <a href="index.html" class="mobile-drawer-link">Home</a>
      <a href="courses.html" class="mobile-drawer-link">Courses</a>
      <a href="about.html" class="mobile-drawer-link">About Us</a>
      <a href="contact.html" class="mobile-drawer-link">Contact</a>
    </nav>
    <div class="mobile-drawer-cta">
      <a href="login.html" class="btn-primary-orange">Return to Log In</a>
    </div>
  </div>

<main id="main-content" class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-header" style="text-align:center;">
      <a href="index.html" aria-label="Instructify Kenya Home" style="display:inline-block; margin-bottom:16px;">
        <img src="assets/images/instructify-kenya-logo.png" alt="Instructify Kenya Logo" style="height:46px; width:auto; max-width:210px; object-fit:contain;">
      </a>
      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Ensure your new password is at least 8 characters long with numbers and letters.</p>
    </div>

    <div id="reset-error-summary" class="ik-form-error-summary" role="alert" aria-live="polite"></div>

    <form id="reset-form" onsubmit="handleResetSubmit(event)" style="display:flex; flex-direction:column; gap:16px;" novalidate>
      <div>
        <label for="new-password" class="form-label">New Password <span style="color:#DC2626;" aria-hidden="true">*</span></label>
        <div class="ik-password-wrapper">
          <input type="password" id="new-password" aria-label="New Password" class="form-input" minlength="8" required placeholder="Minimum 8 characters" autocomplete="new-password">
          <button type="button" class="ik-password-toggle" onclick="toggleResetPasswordVisibility('new-password', this)" aria-label="Show password" aria-pressed="false">👁️</button>
        </div>
      </div>

      <div>
        <label for="confirm-password" class="form-label">Confirm New Password <span style="color:#DC2626;" aria-hidden="true">*</span></label>
        <div class="ik-password-wrapper">
          <input type="password" id="confirm-password" aria-label="Confirm New Password" class="form-input" minlength="8" required placeholder="Re-enter password" autocomplete="new-password">
          <button type="button" class="ik-password-toggle" onclick="toggleResetPasswordVisibility('confirm-password', this)" aria-label="Show password" aria-pressed="false">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" id="reset-submit-btn" style="padding:12px; min-height:48px; font-size:15px; font-weight:700;">
        Update Password &amp; Sign In →
      </button>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:13.5px; color:#5B5882;">
      <a href="login.html" style="color:var(--primary-color, #2563EB); font-weight:700; text-decoration:none;">Cancel &amp; Return to Sign In</a>
    </div>
  </div>
</main>

<script src="js/form-validator.js?v=19.0"></script>
<script src="js/auth.js?v=19.0"></script>
<script src="js/main.js?v=19.0"></script>
<script src="js/site-header.js?v=2026.10" defer></script>
<script>
function toggleResetPasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const nextType = input.type === 'password' ? 'text' : 'password';
  input.type = nextType;
  if (btn) {
    btn.setAttribute('aria-pressed', nextType === 'text' ? 'true' : 'false');
    btn.setAttribute('aria-label', nextType === 'text' ? 'Hide password' : 'Show password');
  }
}

function showResetErrorSummary(messages) {
  const box = document.getElementById('reset-error-summary');
  if (!box) return;
  if (!messages || !messages.length) {
    box.classList.remove('is-visible');
    box.innerHTML = '';
    return;
  }
  const items = messages.map(msg => `<li>${String(msg).replace(/</g, '&lt;')}</li>`).join('');
  box.innerHTML = `<strong>Please check your password requirements:</strong><ul style="margin:6px 0 0 18px;padding:0;">${items}</ul>`;
  box.classList.add('is-visible');
}

function handleResetSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('reset-submit-btn');
  if (btn.disabled) return;
  showResetErrorSummary([]);

  if (window.FormValidator) {
    const valResult = window.FormValidator.validateGroup([
      { id: 'new-password', rules: [{ rule: 'required', label: 'New Password' }, { rule: 'minLength', param: 8, label: 'New Password' }, { rule: 'password', label: 'New Password' }] },
      { id: 'confirm-password', rules: [{ rule: 'required', label: 'Confirm New Password' }, { rule: 'match', param: 'new-password', label: 'Passwords' }] }
    ]);
    if (!valResult.valid) {
      showResetErrorSummary(valResult.errors);
      if (window.showToast) window.showToast(valResult.errors[0] || 'Please enter a valid password matching the requirements.', 'warning');
      if (valResult.firstErrorId) window.FormValidator.focusFirstError(valResult.firstErrorId);
      return;
    }
  } else {
    const p1 = document.getElementById('new-password').value;
    const p2 = document.getElementById('confirm-password').value;
    if (p1 !== p2) {
      showResetErrorSummary(['Passwords do not match. Please re-enter.']);
      window.showToast('❌ Passwords do not match. Please re-enter.', 'error');
      return;
    }
    if (p1.length < 8) {
      showResetErrorSummary(['Password must be at least 8 characters long.']);
      window.showToast('❌ Password must be at least 8 characters long.', 'error');
      return;
    }
  }

  btn.disabled = true;
  btn.textContent = 'Updating password...';

  setTimeout(() => {
    window.showToast('✅ Password updated successfully! Please sign in with your new password.', 'success');
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1200);
  }, 700);
}

document.addEventListener('DOMContentLoaded', () => {
  if (typeof window.updateAuthUI === 'function') window.updateAuthUI();
});
</script>
</body>
</html>
