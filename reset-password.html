<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Instructify Kenya LMS</title>
  <link rel="icon" href="assets/images/instructify-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css?v=3.1">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/live-chat.css">
  <style>
    body {
      background: radial-gradient(120% 120% at 50% 10%, #F8FAFC 0%, #EEF2F6 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-height, 74px) + 32px) 16px 48px;
    }
    .auth-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color, #E2E8F0);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 36px 32px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-title {
      font-size: 26px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 14px;
      color: #64748B;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<!-- Navigation Bar -->
<nav id="navbar" class="navbar">
  <div class="container">
    <a href="index.html" class="nav-brand" aria-label="Instructify Kenya Home">
      <img src="assets/images/logo.png" alt="Instructify Kenya Logo" class="nav-brand-logo">
      <div class="nav-brand-text-box" style="display: inline-flex !important; flex-direction: column !important; justify-content: center !important; align-items: flex-start !important; line-height: 1 !important;">
        <span class="nav-brand-title" style="font-family: var(--font-heading), 'Poppins', sans-serif !important; font-weight: 800 !important; font-size: 1.25rem !important; color: #0F172A !important; letter-spacing: -0.02em !important; line-height: 1 !important; display: block !important;">Instruct<span class="brand-accent" style="color: #F5812D !important; font-weight: 900 !important;">ify</span></span>
        <span class="nav-brand-subtitle" style="font-family: var(--font-heading), 'Poppins', sans-serif !important; font-size: 0.62rem !important; font-weight: 850 !important; color: #FF4D00 !important; text-transform: uppercase !important; letter-spacing: 2.2px !important; line-height: 1 !important; display: block !important;">KENYA</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="courses.html" class="nav-link">Courses</a></li>
      <li><a href="about.html" class="nav-link">About Us</a></li>
    </ul>
  </div>
</nav>

<div class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:16px; background:#EEF2FF; color:#2145E6; font-size:26px; margin-bottom:12px;">
        🔑
      </div>
      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Ensure your new password is at least 8 characters long with numbers and letters.</p>
    </div>

    <form id="reset-form" onsubmit="handleResetSubmit(event)" style="display:flex; flex-direction:column; gap:16px;">
      <div>
        <label for="new-password" class="form-label">New Password</label>
        <input type="password" id="new-password" aria-label="New Password" class="form-input" minlength="8" required placeholder="Minimum 8 characters">
      </div>

      <div>
        <label for="confirm-password" class="form-label">Confirm New Password</label>
        <input type="password" id="confirm-password" aria-label="Confirm New Password" class="form-input" minlength="8" required placeholder="Re-enter password">
      </div>

      <button type="submit" class="btn btn-primary w-full" id="reset-submit-btn" style="padding:12px; font-size:15px; font-weight:700;">
        Update Password &amp; Sign In →
      </button>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:13.5px; color:#64748B;">
      <a href="login.html" style="color:#2145E6; font-weight:700; text-decoration:none;">Cancel &amp; Return to Sign In</a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
function handleResetSubmit(e) {
  e.preventDefault();
  const p1 = document.getElementById('new-password').value;
  const p2 = document.getElementById('confirm-password').value;
  const btn = document.getElementById('reset-submit-btn');

  if (p1 !== p2) {
    window.showToast('❌ Passwords do not match. Please re-enter.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Updating password...';

  setTimeout(() => {
    window.showToast('✅ Password updated successfully! Please sign in with your new password.', 'success');
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1200);
  }, 700);
}
</script>
</body>
</html>
