<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollment Confirmed | Instructify Kenya</title>
  <meta name="description" content="Your enrollment in an Instructify Kenya course is confirmed. Start learning today.">
  <link rel="icon" href="assets/images/instructify-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { background: linear-gradient(135deg, #091929 0%, #12355B 60%, #1A4A7A 100%); min-height: 100vh; }
    .success-page {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem 1.5rem;
    }
    .success-card {
      background: #ffffff; border-radius: 24px;
      padding: 3rem 2.5rem; max-width: 520px; width: 100%;
      box-shadow: 0 32px 80px rgba(0,0,0,0.3);
      text-align: center;
    }
    .success-badge {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, #E0F5F2, #D1FAE5);
      border: 4px solid #0C7A6B;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; margin: 0 auto 1.5rem;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .success-heading {
      font-family: var(--font-heading); font-size: 1.75rem; font-weight: 800;
      color: #0C7A6B; margin-bottom: 0.5rem;
    }
    .success-sub { color: #64748B; font-size: 0.95rem; line-height: 1.65; margin-bottom: 1.75rem; }
    .receipt-box {
      background: #F5F8FC; border: 1px solid #E2E8F0; border-radius: 14px;
      padding: 1.25rem 1.5rem; margin-bottom: 1.75rem; text-align: left;
    }
    .receipt-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.875rem; padding: 6px 0;
      border-bottom: 1px solid #EEF4FB;
    }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-label { color: #94A3B8; font-weight: 500; }
    .receipt-value { color: #1E293B; font-weight: 700; }
    .receipt-value.highlight { color: #12355B; }
    .receipt-value.price { color: #0F9D8A; font-size: 1rem; }
    .btn-start {
      display: block; width: 100%; padding: 16px;
      background: linear-gradient(135deg, #0C7A6B, #047857);
      color: #fff; font-family: var(--font-heading);
      font-weight: 800; font-size: 1.05rem;
      border: none; border-radius: 99px; cursor: pointer;
      text-decoration: none; transition: all 0.2s;
      box-shadow: 0 6px 20px rgba(5,150,105,0.35);
      margin-bottom: 12px;
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(5,150,105,0.45); }
    .btn-browse {
      display: block; color: #64748B; font-size: 0.875rem;
      text-decoration: none; margin-top: 8px;
    }
    .btn-browse:hover { color: #12355B; }
    .confetti-row { font-size: 1.5rem; margin-bottom: 0.5rem; letter-spacing: 6px; }
  </style>
</head>
<body>
<div class="success-page">
  <div class="success-card reveal">
    <div class="confetti-row">🎉 🎊 🎓</div>
    <div class="success-badge">✅</div>
    <h1 class="success-heading">Enrollment Confirmed!</h1>
    <p class="success-sub" id="ps-subtitle">
      You're now enrolled. Welcome aboard — your learning journey starts now!
    </p>

    <div class="receipt-box">
      <div class="receipt-row">
        <span class="receipt-label">Course</span>
        <span class="receipt-value" id="ps-course" style="max-width:220px;text-align:right;line-height:1.3;">—</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Amount Paid</span>
        <span class="receipt-value price" id="ps-amount">—</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Payment Method</span>
        <span class="receipt-value" id="ps-method">—</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Transaction Ref</span>
        <span class="receipt-value highlight" id="ps-ref">—</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Date</span>
        <span class="receipt-value" id="ps-date">—</span>
      </div>
    </div>

    <a href="dashboard-learner.html" class="btn-start" id="ps-start-btn">🚀 Start Learning</a>
    <a href="courses.html" class="btn-browse">← Browse more courses</a>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/courses.js"></script>
<script>
'use strict';

document.addEventListener('DOMContentLoaded', async () => {
  updateAuthUI();

  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');

  if (!ref) {
    // Redirect to dashboard if no ref (direct navigation)
    window.location.href = 'dashboard-learner.html';
    return;
  }

  // Load order details from API
  try {
    const res = await fetch(`/api/verify-payment?ref=${encodeURIComponent(ref)}`);
    if (!res.ok) throw new Error();
    const order = await res.json();

    // Update receipt
    const course = window.COURSES ? window.COURSES.find(c => c.id === order.courseId) : null;
    document.getElementById('ps-course').textContent = order.courseTitle || (course ? course.title : '—');
    document.getElementById('ps-amount').textContent = `KES ${(order.amount / 100).toLocaleString()}`;
    document.getElementById('ps-method').textContent =
      order.paymentMethod === 'mpesa' ? 'M-Pesa' : order.paymentMethod === 'card' ? 'Card' : order.paymentMethod || '—';
    document.getElementById('ps-ref').textContent = order.transactionReference || ref;
    document.getElementById('ps-date').textContent = order.paidAt
      ? new Date(order.paidAt).toLocaleString('en-KE', { dateStyle: 'medium', timeStyle: 'short' })
      : new Date().toLocaleDateString('en-KE');

    document.getElementById('ps-subtitle').textContent =
      `You're enrolled in ${order.courseTitle || 'your course'}. Your learning journey begins now!`;

  } catch {
    // Fallback — show from localStorage
    const enrollments = JSON.parse(localStorage.getItem('ik_enrollments') || '[]');
    const session = window.getSession ? window.getSession() : null;
    const latest = enrollments.filter(e => session && e.userId === session.id)
      .sort((a, b) => new Date(b.enrolledAt) - new Date(a.enrolledAt))[0];

    if (latest) {
      const course = window.COURSES ? window.COURSES.find(c => c.id === latest.courseId) : null;
      if (course) {
        document.getElementById('ps-course').textContent = course.title;
        document.getElementById('ps-amount').textContent = `KES ${course.price.toLocaleString()}`;
      }
      document.getElementById('ps-ref').textContent = ref || latest.id;
      document.getElementById('ps-date').textContent = new Date(latest.enrolledAt).toLocaleDateString('en-KE');
    }
  }
});
</script>
</body>
</html>
