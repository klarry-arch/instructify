<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Pen Barrel -->
  <path d="M62 18 L94 50 L52 92 L20 60 Z" fill="#FFFFFF"/>
  
  <!-- Pen Nib -->
  <path d="M20 60 L52 92 L34 106 L8 112 L15 88 Z" fill="#FFFFFF"/>
  <path d="M8 112 L34 106 L26 84 Z" fill="rgba(0,0,0,0.12)"/>
  <!-- Nib Split & Breather Hole -->
  <line x1="8" y1="112" x2="36" y2="86" stroke="#0000FF" stroke-width="2.5"/>
  <circle cx="36" cy="86" r="3" fill="#0000FF"/>

  <!-- Gold/Orange Accent Grip Ring -->
  <polygon points="48 48 58 38 72 52 62 62" fill="#FF4D00"/>
  <polygon points="38 58 48 48 62 62 52 72" fill="#D93815"/>

  <!-- Pen Body Inset Stripes -->
  <line x1="68" y1="30" x2="86" y2="48" stroke="#0000FF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="78" y1="40" x2="90" y2="52" stroke="#0000FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pen Cap & Clip -->
  <path d="M88 26 C76 44 66 64 60 82" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="59" cy="83" r="3.5" fill="#FF4D00"/>

  <!-- Top Orange Wave Swoosh -->
  <path d="M8 112 C44 94 88 92 118 98" fill="none" stroke="#FF4D00" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom White Wave Swoosh -->
  <path d="M6 116 C46 108 92 112 120 110" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
</svg>
