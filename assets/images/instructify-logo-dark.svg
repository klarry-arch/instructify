<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Pen & Swooshes Icon (Dark version for light backgrounds) -->
  <g transform="translate(10, 10)">
    <!-- Pen Barrel -->
    <path d="M52 14 L80 44 L44 80 L16 50 Z" fill="#0000FF"/>
    
    <!-- Pen Nib -->
    <path d="M16 50 L44 80 L28 92 L6 98 L12 76 Z" fill="#0000FF"/>
    <path d="M6 98 L28 92 L22 72 Z" fill="rgba(0,0,0,0.15)"/>
    <!-- Nib Split & Breather Hole -->
    <line x1="6" y1="98" x2="30" y2="74" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="30" cy="74" r="2.5" fill="#FFFFFF"/>

    <!-- Gold/Orange Accent Grip Ring -->
    <polygon points="40 40 48 32 60 44 52 52" fill="#FF4D00"/>
    <polygon points="32 48 40 40 52 52 44 60" fill="#D93815"/>

    <!-- Pen Body Inset Stripes -->
    <line x1="56" y1="24" x2="72" y2="40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="32" x2="76" y2="44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Pen Cap & Clip -->
    <path d="M74 20 C64 36 56 52 50 68" fill="none" stroke="#0000FF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="49" cy="69" r="3" fill="#FF4D00"/>

    <!-- Top Orange Wave Swoosh -->
    <path d="M6 98 C36 82 76 80 112 86 C144 91 176 96 206 88" fill="none" stroke="#FF4D00" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Bottom Navy/Dark Wave Swoosh -->
    <path d="M4 102 C38 94 80 98 116 106 C152 114 188 110 220 96" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="135" y="56" font-family="'Poppins', sans-serif" font-size="34" font-weight="700" fill="#111827" letter-spacing="-0.5">Instructify</text>
  <text x="137" y="78" font-family="'Poppins', sans-serif" font-size="11.5" font-weight="800" fill="#FF4D00" letter-spacing="4.5">KENYA</text>
</svg>
